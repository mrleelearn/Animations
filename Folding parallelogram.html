<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Parallelogram Dihedral Angle</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #3d1a52; font-family: sans-serif; color: white; }
        #canvas-container { width: 100vw; height: 100vh; }
        #ui-panel {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0, 0, 0, 0.7); padding: 15px;
            border-radius: 8px; border: 1px solid #444;
            z-index: 10;
        }
        .control-group { margin-bottom: 10px; }
        label { cursor: pointer; display: flex; align-items: center; gap: 8px; }
        #angle-display {
            margin-top: 15px; font-weight: bold; font-size: 1.2em; color: #ffeb3b;
        }
        .instructions { font-size: 0.85em; color: #aaa; margin-top: 10px; max-width: 250px; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="ui-panel">
        <div class="control-group">
            <label>
                <input type="checkbox" id="show-lines-cb" checked>
                Show Perpendicular Lines
            </label>
        </div>
        <div class="control-group">
            <label>
                <input type="checkbox" id="show-angle-cb" checked>
                Show Angle Arc
            </label>
        </div>
        <div id="angle-display">Angle between planes: 60.0°</div>
        <div class="instructions">
            - Drag the yellow sphere to fold the plane.<br>
            - Click & drag background to rotate view.
        </div>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Setup Scene ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        // Perspective adjusted to "open to the viewer" (lower Y, closer Z)
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 4, 18);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 0, 0);

        // Lights
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // --- Geometry Data ---
        const A = new THREE.Vector3(-5, 0, 0);
        const C = new THREE.Vector3(5, 0, 0);
        const B = new THREE.Vector3(-2, 0, -4); 
        
        let radiusD = 4; 
        // Modified: Start at 120 deg in coord space so dihedral (diff from 180) is 60
        let currentAngle = Math.PI - (Math.PI / 3); 
        const D = new THREE.Vector3(2, 0, radiusD);

        // --- Visual Elements ---
        const matABC = new THREE.MeshLambertMaterial({ color: 0x2196F3, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
        const geomABC = new THREE.BufferGeometry().setFromPoints([A, B, C]);
        geomABC.computeVertexNormals();
        scene.add(new THREE.Mesh(geomABC, matABC));

        const matADC = new THREE.MeshLambertMaterial({ color: 0x4CAF50, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
        const geomADC = new THREE.BufferGeometry();
        const meshADC = new THREE.Mesh(geomADC, matADC);
        scene.add(meshADC);

        const axisMat = new THREE.LineBasicMaterial({ color: 0xffffff });
        const axisLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints([A, C]), axisMat);
        scene.add(axisLine);

        const perpMat1 = new THREE.LineBasicMaterial({ color: 0xff5722, depthTest: false }); 
        const perpMat2 = new THREE.LineBasicMaterial({ color: 0xffeb3b, depthTest: false }); 
        const perpLine1 = new THREE.Line(new THREE.BufferGeometry(), perpMat1);
        const perpLine2 = new THREE.Line(new THREE.BufferGeometry(), perpMat2);
        perpLine1.renderOrder = 1; perpLine2.renderOrder = 1;
        scene.add(perpLine1, perpLine2);

        const arcLine = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0xffffff, depthTest: false }));
        arcLine.renderOrder = 2;
        scene.add(arcLine);

        const handle = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffeb3b }));
        scene.add(handle);

        function updateGeometry() {
            D.set(2, radiusD * Math.sin(currentAngle), radiusD * Math.cos(currentAngle));
            handle.position.copy(D);

            geomADC.setFromPoints([A, D, C]);
            geomADC.computeVertexNormals();

            const maxPerpDist = (5/7) * radiusD;
            const origin = new THREE.Vector3(0, 0, 0);
            
            const p1End = new THREE.Vector3(0, 0, -maxPerpDist);
            const p2Dir = new THREE.Vector3(0, Math.sin(currentAngle), Math.cos(currentAngle));
            const p2End = p2Dir.multiplyScalar(maxPerpDist);

            perpLine1.geometry.setFromPoints([origin, p1End]);
            perpLine2.geometry.setFromPoints([origin, p2End]);

            const arcPoints = [];
            const segments = 32;
            const arcRadius = 1.8;
            const startAngle = Math.PI;
            const endAngle = currentAngle;
            
            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const a = startAngle + (endAngle - startAngle) * t;
                arcPoints.push(new THREE.Vector3(0, arcRadius * Math.sin(a), arcRadius * Math.cos(a)));
            }
            arcLine.geometry.setFromPoints(arcPoints);

            const angleBetweenPlanes = Math.abs(currentAngle - Math.PI) * (180 / Math.PI);
            document.getElementById('angle-display').innerText = `Angle between planes: ${angleBetweenPlanes.toFixed(1)}°`;
        }

        // --- Interaction ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let isDragging = false;
        const dragPlane = new THREE.Plane(new THREE.Vector3(1, 0, 0), -2);

        window.addEventListener('mousedown', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            if (raycaster.intersectObject(handle).length > 0) {
                isDragging = true;
                controls.enabled = false;
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersection = new THREE.Vector3();
            if (raycaster.ray.intersectPlane(dragPlane, intersection)) {
                currentAngle = Math.atan2(intersection.y, intersection.z);
                updateGeometry();
            }
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            controls.enabled = true;
        });

        document.getElementById('show-lines-cb').addEventListener('change', (e) => {
            perpLine1.visible = perpLine2.visible = e.target.checked;
        });

        document.getElementById('show-angle-cb').addEventListener('change', (e) => {
            arcLine.visible = e.target.checked;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        updateGeometry();
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
